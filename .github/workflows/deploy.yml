name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Follow the actual repository name, including when it is renamed.
      # For a custom domain or a <user>.github.io repository, use "/" instead.
      VITE_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static output
        run: |
          # Outside Lovable the build writes the static site to .output/public;
          # inside Lovable it uses dist/client. Pick whichever exists.
          if [ -f .output/public/index.html ]; then
            OUT=.output/public
          elif [ -f dist/client/index.html ]; then
            OUT=dist/client
          else
            echo "No index.html found in .output/public or dist/client" >&2
            ls -la . .output dist 2>/dev/null || true
            exit 1
          fi
          mkdir -p site
          cp -R "$OUT"/. site/
          # SPA fallback: GitHub Pages serves 404.html for unknown paths.
          cp site/index.html site/404.html
          # Skip Jekyll processing so all asset folders are served as-is.
          touch site/.nojekyll
          find site -name "*.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
