name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must match your repository name: https://<user>.github.io/VOK-new/
      # If you use a custom domain or a <user>.github.io repo, change this to "/".
      VITE_BASE_PATH: /VOK-new/
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static output
        run: |
          # SPA fallback: GitHub Pages serves 404.html for unknown paths,
          # so deep links like /VOK-new/agenda still load the app.
          cp dist/client/index.html dist/client/404.html
          # Skip Jekyll processing so all asset folders are served as-is.
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
